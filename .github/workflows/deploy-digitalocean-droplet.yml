name: Deploy to DigitalOcean Droplet

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: digitalocean-droplet
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Run tests
        run: go test ./internal/easystock/... -count=1

  deploy:
    needs: test
    if: github.event_name == 'workflow_dispatch' || vars.DIGITALOCEAN_AUTO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          password: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.digitalocean
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            registry.digitalocean.com/${{ secrets.DIGITALOCEAN_REGISTRY_NAME }}/easystock:${{ github.sha }}
            registry.digitalocean.com/${{ secrets.DIGITALOCEAN_REGISTRY_NAME }}/easystock:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy deploy files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          source: "docker-compose.digitalocean.yml,deploy/Caddyfile,scripts/deploy.sh,scripts/backup-droplet.sh,scripts/setup-droplet.sh,env.digitalocean.example"
          target: "/opt/easystock"
          overwrite: true

      - name: Deploy on the droplet
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE: registry.digitalocean.com/${{ secrets.DIGITALOCEAN_REGISTRY_NAME }}/easystock:${{ github.sha }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          command_timeout: 20m
          envs: IMAGE,DIGITALOCEAN_ACCESS_TOKEN
          script: |
            set -eu
            cd /opt/easystock
            if [ ! -f .env ]; then
              echo "Missing /opt/easystock/.env. Run scripts/setup-droplet.sh on the droplet first."
              exit 1
            fi
            if grep -q '^EASYSTOCK_IMAGE=' .env; then
              sed -i "s#^EASYSTOCK_IMAGE=.*#EASYSTOCK_IMAGE=${IMAGE}#" .env
            else
              echo "EASYSTOCK_IMAGE=${IMAGE}" >> .env
            fi
            if grep -q '^EASYSTOCK_PULL_POLICY=' .env; then
              sed -i 's#^EASYSTOCK_PULL_POLICY=.*#EASYSTOCK_PULL_POLICY=always#' .env
            else
              echo 'EASYSTOCK_PULL_POLICY=always' >> .env
            fi
            sh scripts/deploy.sh
