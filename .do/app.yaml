name: rangoapp-backend
region: nyc
services:
  - name: api
    github:
      repo: YOUR_USERNAME/rangoapp_back
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile.digitalocean
    source_dir: /
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs  # $5/month - parfait pour <20 utilisateurs
    health_check:
      http_path: /health
      initial_delay_seconds: 10
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: DATABASE_URL_APP
        scope: RUN_TIME
        type: SECRET
      - key: DATABASE_URL_IDENTITY
        scope: RUN_TIME
        type: SECRET
      - key: INTERNAL_CONTEXT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: CLERK_WEBHOOK_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: CLERK_JWKS_URL
        scope: RUN_TIME
        type: SECRET
      - key: CLERK_ISSUER
        scope: RUN_TIME
        type: SECRET
      - key: CLERK_AUTHORIZED_PARTIES
        scope: RUN_TIME
        type: SECRET
      - key: COMMERCE_GRPC_ADDR
        scope: RUN_TIME
        type: SECRET
    routes:
      - path: /
    cors:
      allow_origins:
        - prefix: https://
      allow_methods:
        - GET
        - POST
        - OPTIONS
      allow_headers:
        - Content-Type
        - Authorization
      expose_headers:
        - Content-Length
      max_age: 86400
